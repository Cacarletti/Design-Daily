<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ Picks — Design Daily</title>
<style>
  :root{--bg:#0f1115;--panel:#161922;--panel-2:#1c2030;--txt:#e8eaf0;--muted:#9aa0b4;--line:#262b3a;
    --accent:#7c5cff;--accent-2:#ff5c8a;--star:#ffce4d;--card:#171b26;--radius:16px;--max:1100px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:50;background:rgba(15,17,21,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--star),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
  nav.top{display:flex;gap:4px;flex-wrap:wrap}
  nav.top a{padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s}
  nav.top a:hover{background:var(--panel);color:var(--txt)} nav.top a.active{background:var(--panel-2);color:var(--txt)}
  main{max-width:var(--max);margin:0 auto;padding:28px 24px}
  .intro{color:var(--muted);font-size:14.5px;margin-bottom:8px;max-width:680px}
  .day-block{margin-top:34px}
  .day-block h2{font-size:22px;font-weight:800;letter-spacing:-.4px;text-transform:capitalize;margin-bottom:4px}
  .day-block .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;transition:.18s}
  .card:hover{transform:translateY(-4px);border-color:var(--star);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .thumb{aspect-ratio:16/10;background:var(--panel-2);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--line);font-size:34px}
  .card-body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card-src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
  .card-src .dot{width:5px;height:5px;border-radius:50%;background:var(--star)}
  .tag{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .card h4{font-size:15.5px;font-weight:700;line-height:1.35}
  .card p{font-size:13px;color:var(--muted);flex:1}
  .card .go{font-size:12.5px;font-weight:700;color:var(--star);margin-top:2px}
  .empty-state{text-align:center;color:var(--muted);padding:70px 20px}
  .empty-state h3{font-size:18px;color:var(--txt);margin-bottom:6px}
  footer{max-width:var(--max);margin:0 auto;padding:30px 24px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
  @media(max-width:820px){.header-meta{display:none}header{padding:12px 16px;gap:12px}}
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">★</div>
      <div><h1>Picks</h1><small>seleção do dia · Design Daily</small></div></div>
    <nav class="top">
      <a href="index.html">Notícias</a>
      <a href="picks.html" class="active">⭐ Picks</a>
      <a href="estudios.html">🏛 Estúdios</a>
      <a href="instagram.html">📷 Instagram</a>
      <a href="referencias_pinterest.html">📌 Pinterest</a>
    </nav>
  </header>
  <main id="main"></main>
  <footer>Picks selecionados manualmente a partir do Design Daily.</footer>

  <script src="dados.js"></script>
  <script>
  (function(){
    const H=window.HISTORICO||{}; const picks=H.picks||[]; const main=document.getElementById('main');
    function dataLonga(iso){const[a,m,d]=iso.split('-').map(Number);return new Date(a,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
    function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    let html='<p class="intro">As joias selecionadas a dedo de cada dia. Compartilhe este link com quem quiser.</p>';
    const comItens=picks.filter(d=>d.itens&&d.itens.length);
    if(!comItens.length){
      html+='<div class="empty-state"><h3>Nenhum pick publicado ainda</h3>'+
        '<p>Na aba <b>Notícias</b>, marque a ⭐ dos cards favoritos, clique em <b>Exportar picks do dia</b>,<br>'+
        'salve o arquivo na pasta <code>picks/</code> e dê push.</p></div>';
    }
    comItens.forEach(dia=>{
      html+=`<section class="day-block"><h2>${dataLonga(dia.data)}</h2><div class="sub">${dia.itens.length} pick(s)</div><div class="grid">`;
      dia.itens.forEach(it=>{
        const img=it.imagem?`<div class="thumb"><img loading="lazy" src="${esc(it.imagem)}" alt="" onerror="this.parentNode.classList.add('empty');this.remove();this.parentNode.textContent='◍'"></div>`:`<div class="thumb empty">◍</div>`;
        html+=`<a class="card" href="${esc(it.link)}" target="_blank" rel="noopener">${img}
          <div class="card-body"><div class="card-src"><span class="dot"></span>${esc(it.fonte)}<span class="tag">${esc(it.categoria)}</span></div>
          <h4>${esc(it.titulo)}</h4>${it.descricao?`<p>${esc(it.descricao)}</p>`:''}<span class="go">Ver →</span></div></a>`;
      });
      html+='</div></section>';
    });
    main.innerHTML=html;
  })();
  </script>
</body>
</html>
