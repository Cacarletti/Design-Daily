name: Coleta diária de design

# Quando rodar:
on:
  schedule:
    # GitHub usa horário UTC. 22:00 em Brasília (UTC-3) = 01:00 UTC do dia seguinte.
    # (O horário pode atrasar alguns minutos em dias de pico do GitHub.)
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

# Permissões que o robô precisa para salvar o histórico de volta no repositório.
permissions:
  contents: write

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Coletar posts das últimas 24h
        run: python coletar.py

      - name: Monitorar estúdios sem RSS (novidades do dia)
        run: python monitor_estudios.py

      - name: Montar o site (dados.js)
        run: python gerar_site.py

      - name: Salvar o dia no histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados dados.js estudios_snapshot.json
          # Só faz commit se algo mudou (evita erro em dia sem novidades).
          git diff --cached --quiet || git commit -m "Coleta diária: $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          git push
